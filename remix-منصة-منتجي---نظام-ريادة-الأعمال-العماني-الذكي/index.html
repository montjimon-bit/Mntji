<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>منصة منتجي - نظام ريادة الأعمال العماني الذكي</title>
  <meta name="description" content="المنصة الوطنية المتكاملة لتمكين رواد الأعمال وأصحاب المشاريع العمانية، مستشار الذكاء الاصطناعي لدراسات الجدوى وسوق تجاري عماني شامل." />
  <meta property="og:title" content="منصة منتجي - نظام ريادة الأعمال العماني الذكي" />
  <meta property="og:description" content="المنظومة الوطنية المعتمدة لدعم وتمكين المشاريع ورواد الأعمال في سلطنة عُمان - رؤية عُمان 2040" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231f5b70'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    /* Instant Zero-White-Screen Splash Styles */
    body {
      margin: 0;
      padding: 0;
      background-color: #f8fafb;
      font-family: 'Tajawal', 'Cairo', 'Almarai', sans-serif;
      direction: rtl;
      -webkit-font-smoothing: antialiased;
    }
    #instant-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #153e4d 0%, #0d232d 100%);
      color: #ffffff;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .splash-logo {
      width: 76px;
      height: 76px;
      border-radius: 24px;
      background: linear-gradient(135deg, #c59b5f, #1f5b70);
      padding: 2px;
      box-shadow: 0 16px 36px -6px rgba(13, 35, 45, 0.4);
    }
    .splash-logo-inner {
      width: 100%;
      height: 100%;
      background: #0d232d;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #dfba83;
      font-size: 34px;
      font-weight: 900;
    }
    .splash-title {
      margin-top: 22px;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: #ffffff;
    }
    .splash-badge {
      margin-top: 6px;
      font-size: 13px;
      color: #dfba83;
      font-weight: 700;
    }
    .splash-bar {
      margin-top: 28px;
      width: 140px;
      height: 4px;
      background: rgba(31, 91, 112, 0.4);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
    }
    .splash-bar-inner {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #c59b5f, #dfba83);
      border-radius: 99px;
      animation: splash-shimmer 1.2s infinite ease-in-out;
    }
    @keyframes splash-shimmer {
      0% { transform: translateX(120%); }
      100% { transform: translateX(-120%); }
    }
  </style>
</head>
<body class="bg-[#f8fafb] text-slate-800 antialiased selection:bg-[#1f5b70] selection:text-white">
  <!-- React App Root Container -->
  <div id="root">
    <!-- Immediate Pre-rendered Splash to prevent white screen before JS execution -->
    <div id="instant-splash">
      <div class="splash-logo">
        <div class="splash-logo-inner">مُ</div>
      </div>
      <div class="splash-title">مَنصّة مُنتَجي</div>
      <div class="splash-badge">نظام ريادة الأعمال العماني الذكي · عُمان 2040</div>
      <div class="splash-bar">
        <div class="splash-bar-inner"></div>
      </div>
    </div>
  </div>

  <!-- Vite React Entry Point -->
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
