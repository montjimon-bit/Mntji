<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مُنتجي | الذكاء التفاعلي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --montaji-teal: #22d3ee;
      --montaji-deep: #0891b2;
      --montaji-glow: rgba(34, 211, 238, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #030712;
      color: #ffffff;
      font-family: 'Tajawal', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }

    /* خلفية داكنة مع إضاءة خافتة */
    .bg-ambient {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(8, 145, 178, 0.18) 0%, rgba(3, 7, 18, 0.98) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* الشعار والاسم أعلى اليمين فقط لمُنتجي */
    .top-brand {
      position: absolute;
      top: 28px;
      right: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
      pointer-events: none;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0e7490, #0891b2);
      border: 1px solid var(--montaji-teal);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 16px var(--montaji-glow);
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .brand-title {
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #ffffff, var(--montaji-teal));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* منطقة الروبوت في المنتصف */
    .scene-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
    }

    .robot-rig {
      position: relative;
      width: 320px;
      height: 320px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out;
    }

    .robot-halo {
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--montaji-glow) 0%, transparent 70%);
      opacity: 0.6;
      animation: pulseHalo 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .robot-head {
      position: relative;
      width: 260px;
      height: 220px;
      background: #f8fafc;
      border-radius: 72px;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.7),
        inset 0 -6px 12px rgba(148, 163, 184, 0.4),
        0 0 25px rgba(255, 255, 255, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatRig 4.5s ease-in-out infinite;
    }

    .ear {
      position: absolute;
      top: -26px;
      width: 50px;
      height: 56px;
      background: #f8fafc;
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      filter: drop-shadow(0 -4px 8px rgba(34, 211, 238, 0.3));
    }
    .ear.left { left: 34px; transform: rotate(-14deg); }
    .ear.right { right: 34px; transform: rotate(14deg); }

    .robot-visor {
      position: relative;
      width: 220px;
      height: 172px;
      background: #050811;
      border-radius: 56px;
      box-shadow: inset 0 0 24px rgba(0,0,0,0.95), inset 0 2px 4px rgba(255,255,255,0.15);
      border: 2px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      overflow: hidden;
    }

    .visor-glare {
      position: absolute;
      top: -30%;
      left: -20%;
      width: 140%;
      height: 80%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.12) 0%, transparent 100%);
      transform: rotate(-25deg);
      pointer-events: none;
    }

    .eyes-container {
      display: flex;
      gap: 48px;
      z-index: 2;
    }

    .eye {
      width: 32px;
      height: 40px;
      background: var(--montaji-teal);
      border-radius: 12px;
      box-shadow: 0 0 16px var(--montaji-teal), 0 0 30px var(--montaji-teal);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .eye.happy {
      height: 18px;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      background: transparent;
      border: 6px solid var(--montaji-teal);
      border-bottom: none;
      box-shadow: 0 -4px 16px var(--montaji-teal);
    }

    .eye.blink {
      transform: scaleY(0.08);
    }

    .mouth-grid {
      display: flex;
      align-items: center;
      gap: 5px;
      z-index: 2;
      height: 16px;
    }

    .mouth-bar {
      width: 5px;
      height: 5px;
      background: var(--montaji-teal);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--montaji-teal);
      transition: height 0.08s ease;
    }

    .hand {
      position: absolute;
      top: 50%;
      width: 32px;
      height: 58px;
      background: #f8fafc;
      border-radius: 24px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.5), 0 0 15px rgba(255,255,255,0.4);
      animation: floatHand 3s ease-in-out infinite alternate;
    }
    .hand.left { left: -50px; }
    .hand.right { right: -50px; animation-delay: 0.5s; }

    @keyframes floatRig {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }
    @keyframes floatHand {
      0% { transform: translateY(-4px) rotate(0deg); }
      100% { transform: translateY(8px) rotate(4deg); }
    }
    @keyframes pulseHalo {
      0% { transform: scale(0.9); opacity: 0.35; }
      100% { transform: scale(1.1); opacity: 0.7; }
    }
  </style>
</head>
<body>

  <div class="bg-ambient"></div>

  <!-- الاسم فقط أعلى اليمين -->
  <div class="top-brand">
    <div class="brand-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="brand-title">مُنـتَـجِـي</div>
  </div>

  <!-- وجه الروبوت في المنتصف -->
  <main class="scene-container">
    <div class="robot-rig" id="robotRig">
      <div class="robot-halo"></div>
      <div class="hand left"></div>

      <div class="robot-head">
        <div class="ear left"></div>
        <div class="ear right"></div>

        <div class="robot-visor">
          <div class="visor-glare"></div>
          
          <div class="eyes-container">
            <div class="eye" id="eyeLeft"></div>
            <div class="eye" id="eyeRight"></div>
          </div>

          <div class="mouth-grid" id="mouthGrid">
            <div class="mouth-bar"></div>
            <div class="mouth-bar"></div>
            <div class="mouth-bar"></div>
            <div class="mouth-bar"></div>
            <div class="mouth-bar"></div>
            <div class="mouth-bar"></div>
            <div class="mouth-bar"></div>
          </div>
        </div>
      </div>

      <div class="hand right"></div>
    </div>
  </main>

  <script>
    const robotRig = document.getElementById('robotRig');
    const eyeLeft = document.getElementById('eyeLeft');
    const eyeRight = document.getElementById('eyeRight');
    const mouthGrid = document.getElementById('mouthGrid');
    const mouthBars = mouthGrid.querySelectorAll('.mouth-bar');

    let isTalking = false;
    let mouthInterval = null;
    let isListeningActive = false;

    /* إجابات خاصة فقط بمنصة منتجي دون أي إشارة للمهرجان */
    const knowledgeBase = [
      {
        keywords: ['من انت', 'عرف عن نفسك', 'اسمك', 'مين انت'],
        reply: 'أنا مساعد منصة منتجي الذكي! أستمع إليك وأساعدك في تطوير تجارتك ومبيعاتك.'
      },
      {
        keywords: ['منتجي', 'ما هي', 'المنصة', 'عن منتجي', 'وش تسووا'],
        reply: 'منصة منتجي هي منصة لربط الموردين برواد الأعمال وأصحاب المشاريع لتسهيل وصول المنتجات بأفضل الأسعار.'
      },
      {
        keywords: ['شريك', 'انضمام', 'تسجيل', 'مزود خدمة', 'بائع', 'تاجر'],
        reply: 'الانضمام كشريك سهل جداً، يمكنك إضافة منتجاتك وخدماتك لتصلك طلبات المشترين مباشرة وبشكل فوري.'
      },
      {
        keywords: ['استفيد', 'فائدة', 'مزايا', 'وش استفيد', 'ارباح'],
        reply: 'ستحصل على مبيعات فورية دون تكاليف تسويق، ووصول مباشر لعملاء جاهزين للشراء.'
      },
      {
        keywords: ['مرحبا', 'هلا', 'السلام عليكم', 'الو', 'صباح الخير', 'مساء الخير'],
        reply: 'أهلاً بك! أنا أستمع إليك، كيف يمكنني مساعدتك في منصة منتجي اليوم؟'
      },
      {
        keywords: ['شكرا', 'مشكور', 'تسلم', 'يعطيك العافية'],
        reply: 'العفو، أنا في خدمتك دائماً!'
      }
    ];

    function getLocalReply(text) {
      const q = text.toLowerCase().trim();
      for (const item of knowledgeBase) {
        if (item.keywords.some(k => q.includes(k))) {
          return item.reply;
        }
      }
      return 'أنا معك في منصة منتجي! نسعى لدعم وتنمية مبيعات مشروعك بأحدث الحلول.';
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel();

      if (recognition && isListeningActive) {
        try { recognition.stop(); } catch(e){}
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ar-SA';
      utterance.rate = 0.95;
      utterance.pitch = 1.25;

      const voices = window.speechSynthesis.getVoices();
      const arVoice = voices.find(v => v.lang.startsWith('ar') || v.name.includes('Arabic'));
      if (arVoice) utterance.voice = arVoice;

      utterance.onstart = () => {
        isTalking = true;
        eyeLeft.classList.add('happy');
        eyeRight.classList.add('happy');
        startMouthMotion();
      };

      const finishSpeaking = () => {
        isTalking = false;
        eyeLeft.classList.remove('happy');
        eyeRight.classList.remove('happy');
        stopMouthMotion();
        startAutoListening();
      };

      utterance.onend = finishSpeaking;
      utterance.onerror = finishSpeaking;

      window.speechSynthesis.speak(utterance);
    }

    function startMouthMotion() {
      mouthInterval = setInterval(() => {
        mouthBars.forEach(b => {
          const h = Math.floor(Math.random() * 18) + 4;
          b.style.height = `${h}px`;
        });
      }, 75);
    }

    function stopMouthMotion() {
      clearInterval(mouthInterval);
      mouthBars.forEach(b => b.style.height = '5px');
    }

    /* الاستماع التلقائي الدائم عبر الميكروفون */
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListeningActive = true;
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        if (transcript && transcript.trim().length > 0) {
          const reply = getLocalReply(transcript);
          speak(reply);
        }
      };

      recognition.onend = () => {
        isListeningActive = false;
        if (!isTalking) {
          startAutoListening();
        }
      };

      recognition.onerror = () => {
        isListeningActive = false;
        if (!isTalking) {
          setTimeout(startAutoListening, 1000);
        }
      };
    }

    function startAutoListening() {
      if (recognition && !isListeningActive && !isTalking) {
        try {
          recognition.start();
        } catch(e) {}
      }
    }

    document.addEventListener('click', () => {
      startAutoListening();
    }, { once: true });

    window.addEventListener('load', () => {
      startAutoListening();
    });

    window.addEventListener('mousemove', (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 24;
      const y = (e.clientY / window.innerHeight - 0.5) * 20;
      robotRig.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    setInterval(() => {
      if (!isTalking) {
        eyeLeft.classList.add('blink');
        eyeRight.classList.add('blink');
        setTimeout(() => {
          eyeLeft.classList.remove('blink');
          eyeRight.classList.remove('blink');
        }, 160);
      }
    }, 3800);

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
